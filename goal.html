<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hustle Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hustle">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="manifest" id="manifest" href="">
<style>
:root{
  --bg:#0B0C0F; --surface:#14161D; --ash:#E8E3DA; --mute:#8B877F; --line:#2A2C33;
  --burg:#8C2A3A; --burg-t:#C65B6D; --blue:#7F9CBF;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --pad:6vw;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ash);font-family:var(--sans);
  touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--ash);outline-offset:3px}

header{padding:4vh var(--pad) 0}
.goal{display:block;text-align:left;font-size:15px;color:var(--mute);padding:6px 0}
.goal b{font-weight:400;color:var(--blue)}

.hero{padding:3vh var(--pad) 0}
.cash{font-family:var(--serif);font-weight:400;font-size:clamp(46px,17vw,84px);line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.of{margin-top:1.2vh;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.pct{margin-top:3vh;display:flex;align-items:baseline;gap:3vw;font-family:var(--serif);
  font-size:clamp(34px,11vw,56px);line-height:1;font-variant-numeric:tabular-nums;color:var(--burg-t)}
.pct small{font-family:var(--sans);font-size:14px;color:var(--mute)}

.bar{margin:3vh var(--pad) 0;height:6px;background:var(--surface);border:1px solid var(--line);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--burg);
  transition:width 1.1s cubic-bezier(.22,.8,.2,1)}

.add{margin:4vh var(--pad) 0;height:56px;border:1px solid var(--burg);background:var(--burg);color:var(--ash);
  font-size:16px;letter-spacing:.02em;border-radius:0;transition:background .2s,color .2s}
.add:active{background:var(--bg);color:var(--burg-t)}

.hhead{display:flex;justify-content:space-between;align-items:baseline;padding:4vh var(--pad) 1.2vh;
  border-bottom:1px solid var(--line);margin-top:0;font-size:14px;color:var(--mute)}
.hhead h2{font:400 14px var(--sans);color:var(--ash)}
.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(3vh + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:4vw;width:100%;text-align:left;
  padding:2vh var(--pad);border-bottom:1px solid var(--line)}
.row:active{background:var(--surface)}
.row .n{font-family:var(--serif);font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.row .t{display:block;margin-top:4px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .a{color:var(--blue);font-family:var(--serif);font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:5vh var(--pad);color:var(--mute);font-size:15px;line-height:1.5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(11,12,15,.72);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--burg);
  padding:4vh var(--pad) calc(4vh + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);transition:transform .45s cubic-bezier(.22,.8,.2,1);
  max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sheet.on{transform:none}
.sheet h3{font:400 26px var(--serif);margin-bottom:3vh}
.f{display:block;margin-bottom:3vh}
.f span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.f input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;
  color:var(--ash);font:400 22px var(--serif);padding:8px 0 10px;outline:0;-webkit-appearance:none;appearance:none;
  transition:border-color .25s;-webkit-user-select:text;user-select:text}
.f input:focus{border-bottom-color:var(--blue)}
.err{min-height:18px;margin:-1vh 0 1.5vh;font-size:13px;color:var(--mute)}
.acts{display:flex;gap:3vw}
.acts button{flex:1;height:52px;border:1px solid var(--line);font-size:16px;border-radius:0}
.acts .ok{background:var(--burg);color:var(--ash);border-color:var(--burg)}
.acts .ok:active{background:var(--bg);color:var(--burg-t)}
.del{display:block;margin:2.5vh auto 0;font-size:14px;color:var(--mute);padding:8px}
.del[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.bar i,.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<header><button class="goal" id="goalBtn" aria-label="Edit goal"></button></header>

<section class="hero" aria-live="polite">
  <div class="cash" id="cash">0 ₽</div>
  <div class="of" id="of"></div>
  <div class="pct"><span id="pct">0%</span><small id="state"></small></div>
</section>
<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barWrap"><i id="fill"></i></div>

<button class="add" id="addBtn">Add project</button>

<div class="hhead"><h2>Deployment history</h2><span id="count"></span></div>
<main class="log" id="log"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <h3 id="sTitle"></h3>
  <label class="f"><span id="l1"></span><input id="i1" autocomplete="off" autocapitalize="words" enterkeyhint="next"></label>
  <label class="f"><span id="l2"></span><input id="i2" autocomplete="off" inputmode="numeric" enterkeyhint="done"></label>
  <div class="err" id="err" role="alert"></div>
  <div class="acts"><button id="cancel">Cancel</button><button class="ok" id="save">Save</button></div>
  <button class="del" id="del" hidden>Delete project</button>
</div>

<script>
(function(){
"use strict";
var KEY="hustle-tracker:v1";
var DEF={v:1,goal:{title:"MacBook Air M4",target:150000},entries:[]};
var $=function(id){return document.getElementById(id)};
var state=load(), mode="add", editId=null, shown=0, raf=0;

function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);
    if(d&&d.goal&&Array.isArray(d.entries))return d;}}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}
}
function fmt(n){return Math.round(n).toLocaleString("ru-RU").replace(/\s/g,"\u00A0")+"\u00A0₽"}
function stamp(ts){
  var d=new Date(ts),p=function(x){return String(x).padStart(2,"0")};
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+", "+p(d.getHours())+":"+p(d.getMinutes());
}
function total(){return state.entries.reduce(function(s,e){return s+e.amount},0)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function render(animate){
  var sum=total(),tg=state.goal.target,ratio=tg>0?sum/tg:0,p=Math.min(100,ratio*100);
  $("goalBtn").innerHTML="Saving for <b>"+esc(state.goal.title)+"</b>";
  $("of").textContent="of "+fmt(tg);
  $("state").textContent=ratio>=1?"Goal reached":(fmt(Math.max(0,tg-sum))+" to go");
  $("fill").style.width=p+"%";
  $("barWrap").setAttribute("aria-valuenow",Math.round(p));
  countTo(sum,p,animate);
  $("count").textContent=state.entries.length?state.entries.length+(state.entries.length===1?" project":" projects"):"";
  var list=state.entries.slice().sort(function(a,b){return b.ts-a.ts});
  $("log").innerHTML=list.length?list.map(function(e){
    return '<button class="row" data-id="'+e.id+'"><span><span class="n">'+esc(e.client)+
      '</span><span class="t">'+stamp(e.ts)+'</span></span><span class="a">+'+fmt(e.amount)+'</span></button>';
  }).join(""):'<p class="empty">Nothing logged yet. Finish a job, then add it here.</p>';
}
function countTo(sum,p,animate){
  cancelAnimationFrame(raf);
  var from=shown,to=sum,reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function paint(v){
    $("cash").textContent=fmt(v);
    $("pct").textContent=(to?Math.min(100,(v/state.goal.target)*100):0).toFixed(1).replace(".0","")+"%";
  }
  if(!animate||reduce||from===to){shown=to;paint(to);return}
  var t0=performance.now(),dur=1100;
  (function step(t){
    var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    shown=from+(to-from)*e;paint(shown);
    if(k<1)raf=requestAnimationFrame(step);else{shown=to;paint(to)}
  })(t0);
}

/* sheet */
function open(m,id){
  mode=m;editId=id||null;$("err").textContent="";resetDel();
  var e=id?state.entries.filter(function(x){return x.id===id})[0]:null;
  if(m==="goal"){
    $("sTitle").textContent="Edit goal";
    $("l1").textContent="Goal name";$("i1").value=state.goal.title;
    $("l2").textContent="Target amount (₽)";$("i2").value=state.goal.target;
  }else{
    $("sTitle").textContent=e?"Edit project":"New project";
    $("l1").textContent="Client name";$("i1").value=e?e.client:"";
    $("l2").textContent="Amount (₽)";$("i2").value=e?e.amount:"";
  }
  $("del").hidden=!e;
  $("scrim").classList.add("on");$("sheet").classList.add("on");$("sheet").setAttribute("aria-hidden","false");
  setTimeout(function(){$("i1").focus()},380);
}
function close(){
  $("scrim").classList.remove("on");$("sheet").classList.remove("on");$("sheet").setAttribute("aria-hidden","true");
  document.activeElement&&document.activeElement.blur();
}
function commit(){
  var name=$("i1").value.trim(),amt=parseInt($("i2").value.replace(/[^\d]/g,""),10);
  if(!name){$("err").textContent=mode==="goal"?"Enter a goal name.":"Enter the client name.";$("i1").focus();return}
  if(!amt||amt<1){$("err").textContent="Enter an amount above 0.";$("i2").focus();return}
  if(mode==="goal"){state.goal={title:name,target:amt}}
  else if(editId){state.entries.forEach(function(x){if(x.id===editId){x.client=name;x.amount=amt}})}
  else{state.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),client:name,amount:amt,ts:Date.now()})}
  if(!save()){$("err").textContent="Storage is full or blocked. Changes may not be kept.";return}
  close();render(true);
}

/* events */
$("addBtn").addEventListener("click",function(){open("add")});
$("goalBtn").addEventListener("click",function(){open("goal")});
$("log").addEventListener("click",function(ev){
  var r=ev.target.closest(".row");if(r)open("edit",r.getAttribute("data-id"));
});
$("cancel").addEventListener("click",close);
$("scrim").addEventListener("click",close);
$("save").addEventListener("click",commit);
var delTimer=0;
function resetDel(){clearTimeout(delTimer);$("del").textContent="Delete project";$("del").removeAttribute("data-armed")}
$("del").addEventListener("click",function(){
  if(!$("del").getAttribute("data-armed")){
    $("del").setAttribute("data-armed","1");
    $("del").textContent="Tap again to delete";
    delTimer=setTimeout(resetDel,3000);
    return;
  }
  resetDel();
  state.entries=state.entries.filter(function(x){return x.id!==editId});
  save();close();render(true);
});
$("i1").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("i2").focus()}});
$("i2").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commit()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});

/* block double-tap zoom and pinch */
var lastTouch=0;
document.addEventListener("touchend",function(e){
  var n=Date.now();if(n-lastTouch<300&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();lastTouch=n;
},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(function(g){
  document.addEventListener(g,function(e){e.preventDefault()});
});

/* icon + manifest generated inline (no extra files) */
try{
  var c=document.createElement("canvas");c.width=c.height=512;var x=c.getContext("2d");
  x.fillStyle="#0B0C0F";x.fillRect(0,0,512,512);
  x.fillStyle="#8C2A3A";x.fillRect(116,300,280,16);x.fillStyle="#E8E3DA";
  x.font="400 190px Georgia,serif";x.textAlign="center";x.fillText("H",256,270);
  var icon=c.toDataURL("image/png");$("touchIcon").href=icon;
  var man={name:"Hustle Tracker",short_name:"Hustle",display:"standalone",orientation:"portrait",
    background_color:"#0B0C0F",theme_color:"#0B0C0F",start_url:location.href.split("#")[0],
    icons:[{src:icon,sizes:"512x512",type:"image/png",purpose:"any"}]};
  $("manifest").href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
}catch(e){}

/* ask the browser to protect storage from eviction */
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}

render(true);
})();
</script>
</body>
</html>
